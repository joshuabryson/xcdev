name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"    # nightly: integration tests too

# The runner image and the Xcode are pinned, so a new default image can't change what CI builds with.
env:
  XCODE_APP: /Applications/Xcode_26.2.app

jobs:
  unit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: scripts/select-xcode.sh "$XCODE_APP"
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test

  integration:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: scripts/select-xcode.sh "$XCODE_APP"
      - name: Integration tests (real Xcode, git, and simulators)
        run: XCD_INTEGRATION=1 swift test

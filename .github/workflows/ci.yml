name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"    # nightly: integration tests too

# The runner image and the Xcode are pinned, so a new default image can't change what CI builds with.
env:
  XCODE_APP: /Applications/Xcode_16.4.app

jobs:
  unit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          [ -d "$XCODE_APP" ] || { echo "::error::$XCODE_APP is not installed on this runner image; update XCODE_APP"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test

  integration:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          [ -d "$XCODE_APP" ] || { echo "::error::$XCODE_APP is not installed on this runner image; update XCODE_APP"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Integration tests (real Xcode, git, and simulators)
        run: XCD_INTEGRATION=1 swift test

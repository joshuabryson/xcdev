name: Integration suites

# Each integration suite on a runner of its own, and the sample app's tests run by xcodebuild alone, to read what this
# Xcode's test results say of a failed test.
on:
  push:
    branches: [ci-integration-suites]
  workflow_dispatch:

env:
  XCODE_APP: /Applications/Xcode_26.2.app

jobs:
  suite:
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        suite:
          - AgentCheckoutIntegrationTests
          - BuildRunIntegrationTests
          - DeepLinksIntegrationTests
          - DeviceStateIntegrationTests
          - FormatIntegrationTests
          - IdleShutdownIntegrationTests
          - LintIntegrationTests
          - MacIsolationIntegrationTests
          - MacUIIntegrationTests
          - PostureIntegrationTests
          - ProjectFilesParityTests
          - SetupDoctorIntegrationTests
          - TerminalTests                       # the unit tests that wait out xcd's real interrupt timings
          - UIRunnerIntegrationTests
          - WarningsIntegrationTests
          - WorktreeSimulatorIntegrationTests
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: scripts/select-xcode.sh "$XCODE_APP"
      - name: Runner
        run: |
          xcodebuild -version
          sysctl -n hw.ncpu hw.memsize
          xcrun simctl list runtimes
          command -v swiftlint swiftformat swift-format || true
      - name: Build
        run: swift build
      # Under `script` the tests write to a terminal, which prints each line as it comes, so a job that is
      # cancelled or times out keeps what its tests said. Every 30 seconds the runner's load, memory, booted
      # simulators, and busiest processes are noted for the Load step.
      - name: Suite
        run: |
          (set +e; while sleep 30; do
            echo "== $(date -u +%T)  load $(sysctl -n vm.loadavg)  swap $(sysctl -n vm.swapusage)"
            memory_pressure -Q | tail -1
            echo "booted: $(xcrun simctl list devices booted | grep -c Booted)"
            ps -Ao pcpu=,rss=,ucomm= -r | head -8
          done) > "$RUNNER_TEMP/load.log" 2>&1 &
          XCD_INTEGRATION=1 NO_COLOR=1 script -q /dev/null swift test --filter "\.${{ matrix.suite }}/"
      - name: Load
        if: always()
        run: cat "$RUNNER_TEMP/load.log"
      - name: Crash reports
        if: always()
        run: |
          date -u
          ls -lT ~/Library/Logs/DiagnosticReports || true

  test-results:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: scripts/select-xcode.sh "$XCODE_APP"
      # One of the sample app's tests fails on purpose.
      - name: Sample app's tests
        run: |
          udid=$(xcrun simctl create "Test results" "iPhone 17 Pro")
          xcodebuild test -project Fixtures/SampleApp/SampleApp.xcodeproj -scheme SampleApp -destination "id=$udid" \
            -resultBundlePath "$RUNNER_TEMP/SampleApp.xcresult" -quiet || echo "xcodebuild exited $?"
      # The two commands `xcd test` reads a run's results with.
      - name: Test results
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/SampleApp.xcresult"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/SampleApp.xcresult"
